<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living City · Redefinir senha</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
<div class="auth-wrap">
    <a href="mapa.html"><img class="auth-logo" src="assets/logo.png" alt="Living City"></a>
    <main class="auth-card">
        <a class="back" href="index.html"><i class="bx bx-arrow-back"></i> Voltar</a>
        <h1>Redefinir senha</h1>
        <p class="sub">Informe seu e-mail e enviaremos o link de redefinição.</p>
        <p class="alert-ok" id="okMsg" hidden><i class="bx bx-check-circle"></i> Pronto! Se o e-mail estiver cadastrado, você receberá o link em instantes.</p>
        <form data-action="reset">
        <div class="field">
            <label for="email">E-mail</label>
            <div class="ctl"><i class="bx bx-envelope"></i><input id="email" name="email" type="email" required placeholder="voce@email.com" autocomplete="email"></div>
            <small class="msg"></small>
        </div>
        <div class="field">
            <label for="email2">Confirme o e-mail</label>
            <div class="ctl"><i class="bx bx-envelope"></i><input id="email2" name="email2" type="email" required placeholder="Repita o e-mail" data-match="#email" data-match-msg="Os e-mails não coincidem"></div>
            <small class="msg"></small>
        </div>
            <button class="btn btn-blue full" type="submit">Enviar link</button>
        </form>
    </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
